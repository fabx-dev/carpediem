name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/
      - run: python -m pytest tests/ -q --cov=carpediem --cov-report=term-missing --cov-fail-under=75

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/
      - run: python -m pytest tests/ -q

  build-smoke:
    # Verifica il prodotto come viene distribuito: wheel installata in
    # ambiente pulito, non `pip install -e .` dal repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: python -m venv /tmp/smoke-venv
      - run: /tmp/smoke-venv/bin/pip install dist/*.whl
      - run: /tmp/smoke-venv/bin/carpediem --help
      # cd /tmp: l'import deve risolversi dalla wheel installata, mai dal checkout.
      - run: cd /tmp && /tmp/smoke-venv/bin/python -c "import carpediem, carpediem.main, carpediem.planner, carpediem.storage, carpediem.crypto, carpediem.domain, carpediem.screens.plan, carpediem.integrations.outlook_auth, carpediem.import_csv, carpediem.export_ical; print('smoke import ok')"
      # CLI reale su HOME isolata: oltre --help, add/list scrivono e leggono davvero.
      - run: export CARPEDIEM_HOME=$(mktemp -d) && /tmp/smoke-venv/bin/carpediem add "smoke test" && /tmp/smoke-venv/bin/carpediem list --porcelain && test -z "$(ls -A $CARPEDIEM_HOME | grep -i -E '^\.todo|tasko' || true)"
      # Compat legacy: TASKO_HOME resta supportato come alias.
      - run: export TASKO_HOME=$(mktemp -d) && /tmp/smoke-venv/bin/carpediem add "legacy smoke" && /tmp/smoke-venv/bin/carpediem list --porcelain
      - run: test -f dist/*.whl && test -f dist/*.tar.gz
