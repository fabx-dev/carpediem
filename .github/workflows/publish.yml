# Pubblicazione su PyPI via trusted publishing (OIDC, nessun token nei secret).
#
# Setup una tantum (sul sito PyPI, da fare a mano):
#   1. account su pypi.org (e test.pypi.org per le prove);
#   2. pending publisher per il progetto `carpediem`:
#      owner/repo = fabx-dev/carpediem, workflow = publish.yml
#      (stesso su TestPyPI; il primo upload crea il progetto da solo).
#
# Flusso garantito: commit -> CI verde sullo stesso SHA -> release -> publish.
# Questo workflow NON pubblica mai senza aver rieseguito tutti i gate
# (ruff, format, mypy, pytest, build, smoke da wheel installata) sul
# commit/tag che si sta pubblicando. Vedi docs/release.md.
#
# Uso: Release GitHub -> pubblica su PyPI in automatico;
#      Actions -> Publish -> Run workflow -> testpypi per le prove.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Dove pubblicare (manuale)"
        required: true
        default: "testpypi"
        type: choice
        options: [testpypi, pypi]

jobs:
  gate:
    # Gate esplicito sullo stesso SHA della release: se un solo check
    # fallisce, build e publish non partono (niente `if: success()` tra
    # workflow separati come unica protezione).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: git rev-parse HEAD && git describe --tags --exact-match 2>/dev/null || echo "no exact tag on HEAD (dispatch run)"
      # Il tag deve corrispondere alla versione pubblicata: mai PyPI con
      # note release diverse dall'artefatto (fail-closed, non diagnostica).
      - run: TAG=${{ github.event.release.tag_name }}; if [ -n "$TAG" ]; then test "v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$TAG" || (echo "tag $TAG != pyproject version" && exit 1); fi
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/
      - run: python -m pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=75

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: test -f dist/*.whl && test -f dist/*.tar.gz
      - run: python -m venv /tmp/smoke-venv
      - run: /tmp/smoke-venv/bin/pip install dist/*.whl
      - run: /tmp/smoke-venv/bin/carpediem --help
      # cd /tmp: l'import deve risolversi dalla wheel installata, mai dal checkout.
      - run: cd /tmp && /tmp/smoke-venv/bin/python -c "import src.main, src.planner, src.storage, src.crypto, src.domain, src.screens.plan, src.integrations.outlook_auth, src.import_csv, src.export_ical; print('smoke import ok')"
      # CLI reale su HOME isolata: oltre --help, add/list scrivono e leggono davvero.
      - run: export TASKO_HOME=$(mktemp -d) && /tmp/smoke-venv/bin/carpediem add "smoke test" && /tmp/smoke-venv/bin/carpediem list --porcelain
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
