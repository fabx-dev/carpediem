[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carpediem"
version = "0.12.0"
description = "CarpeDiem: terminal todo manager that turns quick notes into a realistic day plan — natural-language capture, smart planning, pomodoro, agenda, offline-first"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["textual>=0.86.0,<4.0.0", "cryptography>=42", "textual-plotext>=1.0.1,<2", "plotext>=5.2.8,<6"]
keywords = ["todo", "tui", "textual", "productivity", "pomodoro", "planning", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/fabx-dev/carpediem"
Repository = "https://github.com/fabx-dev/carpediem"
Changelog = "https://github.com/fabx-dev/carpediem/blob/main/CHANGELOG.md"

[project.scripts]
carpediem = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
